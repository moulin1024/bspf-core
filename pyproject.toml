[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bspf-core"
version = "0.1.0.dev0"
description = "Consolidated BSPF (B-spline/polynomial + Fourier) bases, assembly and structured solvers in NumPy/JAX"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "scipy>=1.11", "jax>=0.4.38", "gmpy2>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["sphinx>=7", "furo", "myst-parser"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
